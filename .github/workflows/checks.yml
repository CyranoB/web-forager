name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
      # Test the checkout directly; install dependency wheels without build scripts.
      - run: uv sync --frozen --extra dev --no-build --no-install-project
      # Build only this project to generate its version from the checked-out Git state.
      - run: uv pip install --no-deps -e .
      - name: Check plugin release version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/plugin_version.py check --base "$BASE_SHA"
      - run: uv run --no-sync --no-build pytest
      - run: uv run --no-sync --no-build mypy src
      - run: uv run --no-sync --no-build black --check src
      - run: uv run --no-sync --no-build isort --check-only src
