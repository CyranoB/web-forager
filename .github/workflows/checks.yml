name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest
      - run: uv run --frozen --extra dev mypy src
      - run: uv run --frozen --extra dev black --check src
      - run: uv run --frozen --extra dev isort --check-only src
